# nautilm (Nautilus LLM Gateway): example config.
# Copy to config.yaml (gitignored). Secrets always come from ${ENV_VAR}.
# The file is read in strict mode: unknown keys stop the startup.

listen: ":8080"

# Where models run. The provider NAME also identifies "where" in billing:
# name it after the place (bedrock-us-east-2, anthropic-api, ollama-local).
providers:
  bedrock-us-east-2:
    type: bedrock
    region: us-east-2            # the project's Region (single Region)
  ollama-local:
    type: openai                  # any OpenAI-compatible server
    base_url: http://localhost:11434/v1
    timeout: 300s

# Aliases: what agents ask for. Switching the model of "smart" = editing one
# line here; no agent changes.
models:
  smart:
    provider: bedrock-us-east-2
    # Claude 5.5 has NO direct (ON_DEMAND) version in us-east-2: it is only
    # served through cross-Region inference profiles. "us." keeps the data in
    # the US (us-east-1/2, us-west-2); "global." is cheaper and goes anywhere.
    # A single-Region account cannot use either (no Claude 5.5 there).
    # Check with: aws bedrock list-inference-profiles --region us-east-2
    model: us.anthropic.claude-sonnet-5-5
    max_tokens: 4096
    fallback: [fast]              # on 429/5xx, try "fast"
  fast:
    provider: bedrock-us-east-2
    model: amazon.nova-lite-v1:0
    max_tokens: 2048
    fallback: [local]
  local:
    provider: ollama-local
    model: qwen2.5:7b
    max_tokens: 2048

  # Embeddings NEVER have a fallback: vectors from different models do not
  # compare. Changing the embedding model = reindexing everything.
  embed:
    type: embedding
    provider: bedrock-us-east-2
    model: amazon.titan-embed-text-v2:0
    dimensions: 1024              # Titan v2: 256, 512 or 1024
  embed-local:
    type: embedding
    provider: ollama-local
    model: nomic-embed-text

# Price catalog: per PROVIDER + MODEL (not per alias), USD per 1M tokens.
# Bedrock values from the AWS price list for us-east-2 (2026-10-23),
# on-demand. Check the current price list before relying on them.
# (https://aws.amazon.com/bedrock/pricing/ for Bedrock in your Region).
# When a price changes, ADD a line with a new effective_from: history keeps
# the old price.
pricing:
  - provider: bedrock-us-east-2
    model: us.anthropic.claude-sonnet-5-5   # priced by the ID nautilm calls (the profile)
    input: 2.20          # "us." profile price; "global." is 2.00 / 10.00
    output: 11.00
    cache_read: 0.11
    cache_write: 2.75
    effective_from: 2026-10-01
  - provider: bedrock-us-east-2
    model: amazon.nova-lite-v1:0
    input: 0.06
    output: 0.24
    effective_from: 2026-10-01
  - provider: bedrock-us-east-2
    model: amazon.titan-embed-text-v2:0
    input: 0.02
    effective_from: 2026-10-01
  - provider: ollama-local
    model: "*"                    # every model of this provider
    free: true                    # own infrastructure: zero on purpose

# true = a model without a price stops the startup (recommended in production).
# false = warning at startup and "unpriced" in the dashboard (never zero).
strict_pricing: false

auth:
  # In order. On EKS: [kubernetes]. Outside the cluster: [tokens]. Dev: [none].
  modes: [kubernetes, tokens]
  audience: nautilm               # audience of the projected ServiceAccount token
  tokens:                         # one token per agent (outside the cluster)
    k8s: ${NAUTILM_TOKEN_K8S}
    mid: ${NAUTILM_TOKEN_MID}
    marcia: ${NAUTILM_TOKEN_MARCIA}
    claudia: ${NAUTILM_TOKEN_CLAUDIA}
    maestro: ${NAUTILM_TOKEN_MAESTRO}

# Who may use what, and who pays. Key = "namespace/serviceaccount" or token name.
#   team / cost_center: go into every usage record (split the bill by team).
#   tokens_per_minute / tokens_per_day: own quota (0 = "quotas", -1 = no limit).
#   on_behalf_of: may bill a call to the agent it serves (header
#     X-Nautilm-On-Behalf-Of). Only for the orchestrator.
agents:
  k8s:
    models: [smart, fast, embed]
    team: ce
    cost_center: "CC-1001"
  mid:
    models: [smart, fast, embed]
    team: ce
    cost_center: "CC-1001"
    tokens_per_day: 20000000      # busiest agent: bigger daily quota
  marcia:
    models: [fast, local, embed-local]
    team: finance
    cost_center: "CC-2040"
  claudia:
    models: [fast, embed]
    team: support
    cost_center: "CC-3100"
    tokens_per_minute: 50000
  maestro:
    models: [fast, embed]
    team: platform
    on_behalf_of: true
  "*":                            # any other authenticated agent
    models: [fast, embed]
    team: unassigned

# ── Protections: ON by default. Only write them to change something. ──

# Sensitive data masking BEFORE any model (messages, tool results and
# arguments, embeddings). Built-in rules:
#   private_key, jwt, aws_key, bearer, secret, cpf, cnpj, credit_card, email
masking:
  disable: []                     # e.g. [email] if the agent NEEDS to see e-mails
  extra: []                       # e.g. [{name: employee_id, regex: 'MAT-\d{6}'}]
  # disabled: true                # turns everything off (not recommended)

# Token quota (input + output) per agent. Exceeded → 429 + Retry-After, no
# fallback. Default: 200k/minute and 10M/day per agent.
quotas:
  tokens_per_minute: 200000
  tokens_per_day: 10000000
  # disabled: true

# Usage ledger: daily totals per agent × team × provider × model.
usage:
  retention_days: 400
  # disabled: true

# Token for /v1/usage and the /dashboard data. Empty = usage API disabled.
dashboard:
  token: ${NAUTILM_DASHBOARD_TOKEN}

# Shared by quotas and the usage ledger. Empty = in memory (single replica).
valkey_url: ${VALKEY_URL}
