# Exemplo de configuração do pedagio.
# Copie para config.yaml (que está no .gitignore) e ajuste.
# Segredos sempre via ${VARIAVEL}, nunca escritos aqui.

listen: ":8080"

# De onde vêm os modelos.
providers:
  bedrock:
    type: bedrock
    region: us-east-2        # a Região selecionada do seu projeto/conta
  ollama:
    type: openai             # qualquer API compatível com OpenAI (Ollama, vLLM, LiteLLM...)
    base_url: http://localhost:11434/v1
    timeout: 180s

# Apelidos: é SÓ isto que os agentes conhecem.
# Trocar o modelo de "smart" = mudar uma linha aqui, zero mudança nos agentes.
models:
  smart:
    provider: bedrock
    # Confira o ID exato no console do Bedrock (Model catalog) da sua Região.
    # IDs com prefixo "us."/"global." são inference profiles cross-Region:
    # em conta com SCP single-Region (nova experiência AWS) use o ID regional.
    model: anthropic.claude-sonnet-5-5
    max_tokens: 4096
    fallback: [fast]         # se o Bedrock der 429/5xx, tenta "fast"
    # USD por milhão de tokens: VALORES DE EXEMPLO, confira a tabela atual em
    # https://aws.amazon.com/bedrock/pricing/ para o modelo e a sua Região.
    preco: {entrada: 3.00, saida: 15.00}
  fast:
    provider: bedrock
    model: amazon.nova-lite-v1:0
    max_tokens: 2048
    fallback: [local]
    preco: {entrada: 0.06, saida: 0.24}
  local:
    provider: ollama
    model: qwen2.5:7b
    max_tokens: 2048

  # Embeddings (RAG, memória semântica, router). NUNCA têm fallback:
  # vetores de modelos diferentes não se comparam. Trocar o modelo de
  # embedding = reindexar tudo no Valkey.
  embed:
    type: embedding
    provider: bedrock
    model: amazon.titan-embed-text-v2:0
    dimensions: 1024          # Titan v2: 256, 512 ou 1024
    preco: {entrada: 0.02}
  embed-local:
    type: embedding
    provider: ollama
    model: nomic-embed-text    # 768 dimensões

auth:
  # Em ordem. No EKS: [kubernetes]. Laboratório/CLI: [tokens]. Dev local: [none].
  modes: [kubernetes, tokens]
  audience: pedagio          # audience do token projetado da ServiceAccount
  tokens:
    ce-cli: ${PEDAGIO_TOKEN_CE_CLI}

# Quem pode usar o quê. Chave = "namespace/serviceaccount" ou nome do token.
# tokens_por_minuto / tokens_por_dia: cota própria (0 ou ausente = usa
# "cotas", -1 = sem limite).
agents:
  observability/kubets:
    models: [smart, fast, embed]
  mq/midts:
    models: [smart, fast, embed]
    tokens_por_dia: 20000000   # agente mais usado: cota maior
  ce-cli:
    models: [fast, embed]
    tokens_por_minuto: 50000   # CLI de humano: mais apertado
  "*":                       # qualquer outro agente autenticado
    models: [fast, embed]

# ── Proteções: LIGADAS por padrão. Só escreva se quiser mudar algo. ──

# Mascaramento de dados sensíveis ANTES de qualquer modelo (mensagens,
# resultados e argumentos de tool, embeddings). Regras embutidas:
#   chave_privada, jwt, aws_key, bearer, segredo, cpf, cnpj, cartao, email
mascarar:
  desligar: []                 # ex: [email] se o agente PRECISA ver e-mails
  extra: []                    # ex: [{nome: matricula, regex: 'MAT-\d{6}'}]
  # desligado: true            # desliga tudo (não recomendado)

# Cota de tokens (entrada + saída) por agente. Estourou → 429 + Retry-After,
# sem fallback. Padrão: 200 mil/minuto e 10 milhões/dia por agente.
cotas:
  tokens_por_minuto: 200000
  tokens_por_dia: 10000000
  valkey_url: ${VALKEY_URL}    # vazio = memória (1 réplica); com várias réplicas use o Valkey
  # desligado: true
