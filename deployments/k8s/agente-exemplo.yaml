# Como um agente usa o pedagio: token projetado da ServiceAccount com
# audience "pedagio". O kubelet renova o arquivo sozinho; o agente só lê e
# manda em Authorization: Bearer <conteúdo do arquivo>, relendo a cada chamada.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubets
  namespace: observability
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubets
  namespace: observability
spec:
  replicas: 1
  selector:
    matchLabels: {app: kubets}
  template:
    metadata:
      labels: {app: kubets}
    spec:
      serviceAccountName: kubets       # identidade no pedagio: observability/kubets
      containers:
        - name: kubets
          image: ghcr.io/chwiee/kubets:latest
          env:
            - {name: LLM_BASE_URL, value: "http://pedagio.llm-gateway/v1"}
            - {name: LLM_MODEL, value: "smart"}            # apelido, nunca o ID do modelo
            - {name: LLM_TOKEN_FILE, value: "/var/run/secrets/pedagio/token"}
          volumeMounts:
            - {name: pedagio-token, mountPath: /var/run/secrets/pedagio, readOnly: true}
      volumes:
        - name: pedagio-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: pedagio
                  expirationSeconds: 3600
