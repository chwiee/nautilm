# nautilm (Nautilus LLM Gateway) on EKS.
# Prerequisites:
#   1. IAM role with bedrock:InvokeModel AND bedrock:InvokeModelWithResponseStream (streaming)
#      on the models in use, in the project's Region.
#   2. Pod Identity association: namespace llm-gateway, SA nautilm → that role.
#      aws eks create-pod-identity-association --cluster-name <cluster> \
#        --namespace llm-gateway --service-account nautilm --role-arn <role-arn>
#   3. ElastiCache for Valkey (quotas + usage ledger), URL in the nautilm-secrets Secret.
#   4. PostgreSQL (dashboard tokens, sessions, audit): deployments/k8s/postgres.yaml.
#      Its connection URL lives in AWS Secrets Manager as "nautilm/database"
#      (plain string postgres://... or JSON with a "url" key); the role needs
#      secretsmanager:GetSecretValue on it (deployments/aws/nautilm-policy.json).
#   5. Entra ID App Registration (README: "Login com Entra ID"): redirect URI
#      https://<public_url>/auth/callback, groups claim = groups assigned to the app.
#   6. HTTPS in front of the dashboard (Ingress/ALB): the session cookie is Secure.
# The AGENTS need no IAM role at all.
apiVersion: v1
kind: Namespace
metadata:
  name: llm-gateway
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nautilm
  namespace: llm-gateway
---
# Lets nautilm create TokenReviews (validate the agents' tokens).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: nautilm-auth-delegator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: nautilm
    namespace: llm-gateway
---
# Create it out of band (never commit real values):
#   kubectl -n llm-gateway create secret generic nautilm-secrets \
#     --from-literal=VALKEY_URL=rediss://<elasticache-endpoint>:6379 \
#     --from-literal=NAUTILM_DASHBOARD_TOKEN=$(openssl rand -hex 24) \
#     --from-literal=NAUTILM_ENTRA_CLIENT_SECRET=<client secret of the App Registration>
apiVersion: v1
kind: ConfigMap
metadata:
  name: nautilm
  namespace: llm-gateway
data:
  config.yaml: |
    listen: ":8080"
    providers:
      bedrock-us-east-2: {type: bedrock, region: us-east-2}
    models:
      smart: {provider: bedrock-us-east-2, model: us.anthropic.claude-sonnet-5-5, max_tokens: 4096, fallback: [fast]}   # inference profile: Claude 5.5 has no direct version in us-east-2
      fast:  {provider: bedrock-us-east-2, model: amazon.nova-lite-v1:0, max_tokens: 2048}
      embed: {type: embedding, provider: bedrock-us-east-2, model: amazon.titan-embed-text-v2:0, dimensions: 1024}
    # EXAMPLE prices (USD per 1M tokens): check the Bedrock price list for your Region.
    pricing:
      - {provider: bedrock-us-east-2, model: us.anthropic.claude-sonnet-5-5, input: 2.20, output: 11.00, cache_read: 0.11, cache_write: 2.75, effective_from: 2026-10-01}
      - {provider: bedrock-us-east-2, model: amazon.nova-lite-v1:0, input: 0.06, output: 0.24, effective_from: 2026-10-01}
      - {provider: bedrock-us-east-2, model: amazon.titan-embed-text-v2:0, input: 0.02, effective_from: 2026-10-01}
    strict_pricing: true
    auth:
      modes: [kubernetes]
      audience: nautilm
    agents:
      observability/kubets: {models: [smart, fast, embed], team: ce, cost_center: CC-1001}
      platform/maestro: {models: [fast, embed], team: platform, on_behalf_of: true}
      "*": {models: [fast, embed], team: unassigned}
    usage: {retention_days: 400}
    dashboard:
      token: ${NAUTILM_DASHBOARD_TOKEN}            # read-only automation (Grafana, scripts)
      public_url: https://nautilm.example.com      # CHANGE: the URL people open
      session_ttl: 8h
      entra:
        tenant_id: <tenant-id>                     # CHANGE
        client_id: <application-client-id>         # CHANGE
        client_secret: ${NAUTILM_ENTRA_CLIENT_SECRET}
        admin_groups: [<object-id-of-the-admin-group>]    # create/rotate/revoke tokens
        viewer_groups: [<object-id-of-the-viewer-group>]  # read usage only
    database:
      aws_secret_arn: arn:aws:secretsmanager:us-east-2:<ACCOUNT_ID>:secret:nautilm/database-XXXXXX   # full ARN (Region comes from it)
    valkey_url: ${VALKEY_URL}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nautilm
  namespace: llm-gateway
spec:
  replicas: 2   # quotas and the ledger live in Valkey: replicas share them
  selector:
    matchLabels: {app: nautilm}
  template:
    metadata:
      labels: {app: nautilm}
    spec:
      serviceAccountName: nautilm
      terminationGracePeriodSeconds: 70   # > the 60s graceful shutdown
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: nautilm
          image: ghcr.io/chwiee/nautilm:0.5.0
          args: ["-config", "/etc/nautilm/config.yaml"]
          envFrom:
            - secretRef: {name: nautilm-secrets}
          ports: [{name: http, containerPort: 8080}]
          readinessProbe: {httpGet: {path: /healthz, port: http}}
          livenessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 20}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: config, mountPath: /etc/nautilm}
      volumes:
        - name: config
          configMap: {name: nautilm}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: nautilm
  namespace: llm-gateway
spec:
  minAvailable: 1
  selector:
    matchLabels: {app: nautilm}
---
apiVersion: v1
kind: Service
metadata:
  name: nautilm
  namespace: llm-gateway
spec:
  selector: {app: nautilm}
  ports: [{name: http, port: 80, targetPort: http}]
