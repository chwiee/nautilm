# PostgreSQL in a pod with a PVC (local cluster). Credentials come from the
# "postgres-auth" Secret created by up.sh (random password, never in git).
apiVersion: v1
kind: Service
metadata: {name: postgres, namespace: nautilm}
spec:
  selector: {app: postgres}
  ports: [{name: pg, port: 5432, targetPort: 5432}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: postgres, namespace: nautilm}
spec:
  serviceName: postgres
  replicas: 1
  selector: {matchLabels: {app: postgres}}
  template:
    metadata: {labels: {app: postgres}}
    spec:
      securityContext: {fsGroup: 70, runAsUser: 70, runAsGroup: 70, runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: postgres
          image: postgres:17-alpine
          env:
            - {name: POSTGRES_DB, value: nautilm}
            - {name: POSTGRES_USER, value: nautilm}
            - {name: POSTGRES_PASSWORD, valueFrom: {secretKeyRef: {name: postgres-auth, key: password}}}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          ports: [{containerPort: 5432}]
          readinessProbe: {exec: {command: ["pg_isready", "-U", "nautilm", "-d", "nautilm"]}, periodSeconds: 5}
          resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {memory: 512Mi}}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 1Gi}}
---
# Daily logical backup (pg_dump) to its own PVC, keeping the last 7 days.
# A database in a pod is YOUR backup to make: this is the minimum.
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: postgres-backup, namespace: nautilm}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 1Gi}}
---
apiVersion: batch/v1
kind: CronJob
metadata: {name: postgres-backup, namespace: nautilm}
spec:
  schedule: "0 3 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          securityContext: {fsGroup: 70, runAsUser: 70, runAsGroup: 70, runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
          containers:
            - name: dump
              image: postgres:17-alpine
              env:
                - {name: PGPASSWORD, valueFrom: {secretKeyRef: {name: postgres-auth, key: password}}}
              command: ["/bin/sh", "-c"]
              args:
                - >-
                  set -e;
                  f=/backup/nautilm-$(date +%Y%m%d-%H%M%S).sql.gz;
                  pg_dump -h postgres -U nautilm -d nautilm | gzip > "$f";
                  ls -1t /backup/nautilm-*.sql.gz | tail -n +8 | xargs -r rm -f;
                  echo "backup ok: $f"
              securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
              volumeMounts: [{name: backup, mountPath: /backup}]
          volumes: [{name: backup, persistentVolumeClaim: {claimName: postgres-backup}}]
